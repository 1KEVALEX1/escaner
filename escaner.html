<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0D1014">
<title>Escáner de asistencia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0D1014; --panel:#161A20; --linea:#232932;
    --texto:#E8EAED; --fuerte:#F4F6F8; --tenue:#8B95A1;
    --ok:#3DD68C; --tarde:#F5B544; --salida:#7AA7FF; --error:#FF6B6B; --neutro:#9AA3AE;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:"Geist",system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--texto);
       min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;
       padding:20px;padding-top:max(20px,env(safe-area-inset-top));padding-bottom:max(20px,env(safe-area-inset-bottom));
       -webkit-font-smoothing:antialiased}
  .hidden{display:none!important}
  .mono{font-family:"Geist Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
  .ic{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block}
  .etiqueta{font-family:"Geist Mono",ui-monospace,monospace;font-size:12px;letter-spacing:.14em;color:var(--tenue);text-transform:uppercase}

  /* ───── PIN ───── */
  .pin{width:100%;max-width:360px;flex:1;display:flex;flex-direction:column;justify-content:center}
  .pin h1{font-size:28px;font-weight:600;letter-spacing:-.02em;color:var(--fuerte);margin-top:14px}
  .pin .sub{color:var(--tenue);font-size:15px;line-height:1.5;margin-top:6px;margin-bottom:32px}
  .pin label{display:block;margin-bottom:8px}
  .pin input{width:100%;padding:16px;border-radius:14px;border:1px solid var(--linea);background:var(--panel);color:var(--fuerte);
             font-family:"Geist Mono",ui-monospace,monospace;font-size:20px;letter-spacing:.3em;text-align:center;outline:none;
             transition:border-color .15s}
  .pin input:focus{border-color:var(--salida)}
  .error-pin{color:#FF8A8A;font-size:14px;line-height:1.4;min-height:20px;margin:10px 0 14px;text-align:center}
  .btn{width:100%;min-height:52px;padding:14px 16px;border-radius:14px;border:0;background:var(--fuerte);color:var(--bg);
       font:inherit;font-size:16px;font-weight:600;cursor:pointer}
  .btn:active{transform:scale(.99)}
  .btn.sec{background:var(--panel);color:var(--texto);border:1px solid var(--linea)}

  /* ───── ESCÁNER ───── */
  .escaner{width:100%;max-width:440px;display:flex;flex-direction:column}
  .barra{display:flex;justify-content:space-between;align-items:center;min-height:44px;margin-bottom:12px}
  .link{background:none;border:0;color:var(--tenue);font:inherit;font-size:14px;padding:12px 0 12px 12px;cursor:pointer}
  .link:hover{color:var(--texto)}
  #lector{width:100%;border-radius:24px;overflow:hidden;background:#000;min-height:300px;border:1px solid var(--linea)}
  #lector video{display:block}
  .listo{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:20px;font-size:15px;color:var(--texto)}
  .punto{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 4px rgba(61,214,140,.15)}
  .ayuda{color:var(--tenue);font-size:13px;line-height:1.5;text-align:center;margin-top:8px}
  #btn-camara{margin-top:16px}

  /* ───── BANNER MODO PRUEBA ───── */
  .banner{position:fixed;top:0;left:0;right:0;z-index:20;background:var(--tarde);color:var(--bg);text-align:center;
          font-family:"Geist Mono",ui-monospace,monospace;font-size:12px;font-weight:500;letter-spacing:.12em;
          padding:8px 12px;padding-top:max(8px,env(safe-area-inset-top))}
  body.prueba{padding-top:calc(max(20px,env(safe-area-inset-top)) + 36px)}

  /* ───── RESULTADO ───── */
  .resultado{position:fixed;inset:0;z-index:10;background:var(--bg);display:flex;flex-direction:column;
             padding:28px 24px 32px;padding-top:max(28px,env(safe-area-inset-top));padding-bottom:max(32px,env(safe-area-inset-bottom));
             cursor:pointer;animation:entra .18s ease-out}
  body.prueba .resultado{padding-top:calc(max(28px,env(safe-area-inset-top)) + 36px)}
  @keyframes entra{from{opacity:0}to{opacity:1}}
  .r-entrada{--c:#3DD68C;--c10:rgba(61,214,140,.10)}
  .r-retardo{--c:#F5B544;--c10:rgba(245,181,68,.10)}
  .r-salida {--c:#7AA7FF;--c10:rgba(122,167,255,.10)}
  .r-cerrado{--c:#9AA3AE;--c10:rgba(154,163,174,.10)}
  .r-error  {--c:#FF6B6B;--c10:rgba(255,107,107,.10)}
  .r-cabecera{display:flex;justify-content:space-between;width:100%;max-width:440px;margin:0 auto}
  .r-centro{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
            width:100%;max-width:440px;margin:0 auto}
  .aro{width:120px;height:120px;flex:none;border-radius:50%;border:2px solid var(--c);background:var(--c10);color:var(--c);
       display:flex;align-items:center;justify-content:center;animation:aparece .35s cubic-bezier(.2,.9,.3,1.2)}
  @keyframes aparece{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
  .r-estado{margin-top:28px;font-size:16px;font-weight:600;color:var(--c)}
  .r-nombre{margin-top:10px;font-size:clamp(26px,8.5vw,34px);font-weight:600;line-height:1.12;letter-spacing:-.02em;
            color:var(--fuerte);overflow-wrap:anywhere}
  .datos{margin-top:36px;width:100%;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));
         border-top:1px solid var(--linea);border-bottom:1px solid var(--linea)}
  .datos > div{padding:16px 4px}
  .datos > div + div{border-left:1px solid var(--linea)}
  .datos .k{font-size:11px;letter-spacing:.12em;color:var(--tenue)}
  .datos .v{margin-top:6px;font-size:16px;color:var(--texto)}
  .datos .v.id{font-size:14px;overflow-wrap:anywhere}
  .puntos{margin-top:24px;padding:8px 16px;border-radius:999px;border:1px solid rgba(61,214,140,.4);color:var(--ok);
          font-size:16px;font-weight:600}
  .aviso{margin-top:28px;width:100%;padding:18px 20px;border-radius:16px;background:var(--panel);border:1px solid var(--linea);text-align:left}
  .aviso .k{font-size:11px;letter-spacing:.12em;color:var(--c)}
  .aviso .v{margin-top:8px;font-size:16px;line-height:1.5;color:#C9D0D8}
  .progreso{height:3px;border-radius:2px;background:#1C2128;overflow:hidden;width:100%;max-width:440px;margin:0 auto}
  .progreso div{height:100%;background:var(--c);transform-origin:left;animation:vaciar linear forwards}
  @keyframes vaciar{from{transform:scaleX(1)}to{transform:scaleX(0)}}
  .toca{margin-top:12px;text-align:center;font-size:13px;color:var(--tenue)}
  .cargando{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px}
  .spinner{width:56px;height:56px;border:2px solid var(--linea);border-top-color:var(--texto);border-radius:50%;animation:gira .8s linear infinite}
  @keyframes gira{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion: reduce){.aro,.resultado{animation:none}}
</style>
</head>
<body>

<div id="banner-prueba" class="banner hidden">MODO PRUEBA · NO CUENTA ASISTENCIA</div>

<!-- ───────── PIN ───────── -->
<main id="pantalla-pin" class="pin">
  <div class="etiqueta">Asistencia</div>
  <h1>Escáner del personal</h1>
  <p class="sub">Ingresa tu PIN para comenzar a escanear credenciales.</p>
  <label for="pin" class="etiqueta">PIN</label>
  <input id="pin" type="password" autocomplete="off" autocapitalize="off" spellcheck="false">
  <div id="error-pin" class="error-pin" role="alert"></div>
  <button id="btn-entrar" class="btn" type="button">Entrar</button>
</main>

<!-- ───────── ESCÁNER ───────── -->
<main id="pantalla-escaner" class="escaner hidden">
  <div class="barra">
    <span class="etiqueta">Asistencia · <span id="fecha-hoy"></span></span>
    <button id="btn-cambiar" class="link" type="button">Cambiar PIN</button>
  </div>
  <div id="lector"></div>
  <div id="listo" class="listo hidden"><span class="punto"></span>Listo para escanear</div>
  <p class="ayuda" id="ayuda">Apunta la cámara al QR de entrada o de salida de la credencial.</p>
  <button class="btn sec hidden" id="btn-camara" type="button">Iniciar cámara</button>
</main>

<!-- ───────── RESULTADO ───────── -->
<div id="resultado" class="resultado hidden" onclick="cerrarResultado()" aria-live="assertive"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<script>
// ▼▼ URL de tu web app (la misma que usan los QR impresos) ▼▼
var EXEC_URL = "https://script.google.com/macros/s/AKfycbycTrzqXkgoSm8RlGixKn3HI817Y2IT5cYZzc60yverRKOs46D-ZHQJ6ThTa47sl5LP/exec";

// Modo prueba: abre esta página con ?prueba=1 (y opcional &hora=12:00 para simular la hora)
var PAGINA      = new URLSearchParams(location.search);
var MODO_PRUEBA = PAGINA.get("prueba") === "1";
var HORA_SIM    = PAGINA.get("hora") || "";

var PIN_KEY = "asistencia_pin";
var pin = "";
var lector = null;
var procesando = false;
var ultimoTexto = "";
var ultimoTiempo = 0;
var temporizador = null;

var el = function (id) { return document.getElementById(id); };

function guardar(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function leer(k)       { try { return localStorage.getItem(k) || ""; } catch (e) { return ""; } }
function borrar(k)     { try { localStorage.removeItem(k); } catch (e) {} }

function mostrarPantallaPin(mensaje) {
  detenerCamara();
  el("pantalla-escaner").classList.add("hidden");
  el("pantalla-pin").classList.remove("hidden");
  el("error-pin").textContent = mensaje || "";
  el("pin").value = "";
  el("pin").focus();
}

function mostrarPantallaEscaner() {
  el("pantalla-pin").classList.add("hidden");
  el("pantalla-escaner").classList.remove("hidden");
  arrancarCamara();
}

el("btn-entrar").onclick = function () {
  var v = el("pin").value.trim();
  if (!v) { el("error-pin").textContent = "Escribe tu PIN."; return; }
  pin = v;
  guardar(PIN_KEY, pin);
  mostrarPantallaEscaner();
};
el("pin").addEventListener("keydown", function (e) { if (e.key === "Enter") el("btn-entrar").click(); });
el("btn-cambiar").onclick = function () { borrar(PIN_KEY); pin = ""; mostrarPantallaPin(""); };
el("btn-camara").onclick = function () { arrancarCamara(); };

// ───────── Cámara ─────────
function arrancarCamara() {
  el("btn-camara").classList.add("hidden");
  if (lector) { return; }
  try {
    lector = new Html5Qrcode("lector");
  } catch (e) {
    lector = null;
    el("ayuda").textContent = "No se pudo cargar el lector de QR. Revisa la conexión y recarga la página.";
    el("btn-camara").classList.remove("hidden");
    return;
  }
  lector.start(
    { facingMode: "environment" },
    { fps: 10, qrbox: function (w, h) { var s = Math.floor(Math.min(w, h) * 0.7); return { width: s, height: s }; } },
    onScan,
    function () {}
  ).then(function () {
    el("listo").classList.remove("hidden");
    el("ayuda").textContent = "Apunta la cámara al QR de entrada o de salida de la credencial.";
  }).catch(function (err) {
    lector = null;
    el("listo").classList.add("hidden");
    el("ayuda").textContent = "No se pudo abrir la cámara. Revisa el permiso del navegador y vuelve a intentarlo.";
    el("btn-camara").classList.remove("hidden");
  });
}

function detenerCamara() {
  el("listo").classList.add("hidden");
  if (lector) {
    var l = lector; lector = null;
    l.stop().then(function () { l.clear(); }).catch(function () {});
  }
}

// ───────── Lectura del QR ─────────
function parsearQR(texto) {
  var i = texto.indexOf("?");
  if (i < 0) return null;
  var p = new URLSearchParams(texto.substring(i + 1));
  var id = p.get("id"), tipo = p.get("tipo");
  if (!id || !tipo) return null;
  return { id: id, nombre: p.get("nombre") || "", tipo: tipo, v: p.get("v") || "", c: p.get("c") || "" };
}

function onScan(texto) {
  if (procesando) return;
  var ahora = Date.now();
  if (texto === ultimoTexto && ahora - ultimoTiempo < 5000) return;   // evita doble lectura
  ultimoTexto = texto; ultimoTiempo = ahora;

  var datos = parsearQR(texto);
  if (!datos) {
    procesando = true;
    mostrarResultado({ estado: "error", mensaje: "Este QR no es una credencial del sistema." });
    return;
  }
  enviar(datos);
}

function enviar(d) {
  procesando = true;
  mostrarCargando();

  var params = new URLSearchParams({ formato: "json", pin: pin, id: d.id, nombre: d.nombre, tipo: d.tipo });
  if (d.v) params.set("v", d.v);
  if (d.c) params.set("c", d.c);
  if (MODO_PRUEBA) {
    params.set("prueba", "1");
    if (HORA_SIM) params.set("hora", HORA_SIM);
  }

  fetch(EXEC_URL + "?" + params.toString(), { redirect: "follow" })
    .then(function (r) {
      return r.text().then(function (t) {
        try { return JSON.parse(t); }
        catch (e) {
          var pista = /accounts\.google|ServiceLogin|Iniciar sesi/i.test(t)
            ? "El script pide iniciar sesión: cambia el acceso de la implementación a 'Cualquier persona'."
            : "El script no respondió como se esperaba (HTTP " + r.status + "). Revisa que esté publicada la versión nueva.";
          throw { tipo: "respuesta", mensaje: pista };
        }
      });
    })
    .then(function (res) {
      if (res.estado === "noauth") {
        cerrarResultado();
        borrar(PIN_KEY); pin = "";
        mostrarPantallaPin(res.mensaje || "PIN incorrecto.");
        return;
      }
      mostrarResultado(res);
    })
    .catch(function (err) {
      var msg;
      if (err && err.tipo === "respuesta") {
        msg = err.mensaje;
      } else if (!navigator.onLine) {
        msg = "El teléfono no tiene internet. Revisa la conexión y vuelve a escanear.";
      } else {
        msg = "No se pudo conectar con el script. Lo más probable: el acceso de la implementación no está en 'Cualquier persona' (sin cuenta de Google).";
      }
      mostrarResultado({ estado: "error", mensaje: msg });
    });
}

// ───────── Formato ─────────
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}

// "HERNANDEZ DE LA CRUZ ANA" → "Hernandez de la Cruz Ana"
var PARTICULAS = { de: 1, del: 1, la: 1, las: 1, los: 1, y: 1, e: 1, van: 1, von: 1, da: 1, di: 1 };
function capitalizar(p) { return p.charAt(0).toLocaleUpperCase("es-MX") + p.slice(1); }
function nombreBonito(s) {
  s = String(s || "").trim().replace(/\s+/g, " ");
  if (!s) return "";
  return s.toLocaleLowerCase("es-MX").split(" ").map(function (p, i) {
    if (i > 0 && PARTICULAS[p]) return p;
    return p.split("-").map(capitalizar).join("-");
  }).join(" ");
}

var DIAS  = ["DOM", "LUN", "MAR", "MIÉ", "JUE", "VIE", "SÁB"];
var MESES = ["ENE", "FEB", "MAR", "ABR", "MAY", "JUN", "JUL", "AGO", "SEP", "OCT", "NOV", "DIC"];
function aFecha(f) {   // "dd/MM/yyyy" → Date (si no viene, hoy)
  var m = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec(f || "");
  return m ? new Date(+m[3], +m[2] - 1, +m[1]) : new Date();
}
function fechaCabecera(f) { var d = aFecha(f); return DIAS[d.getDay()] + " " + d.getDate() + " " + MESES[d.getMonth()]; }
function fechaCorta(f) {
  var m = /^(\d{2})\/(\d{2})\/\d{2}(\d{2})$/.exec(f || "");
  return m ? m[1] + "·" + m[2] + "·" + m[3] : (f || "—");
}

// ───────── Resultado ─────────
var SVG = {
  check:  '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  reloj:  '<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>',
  salida: '<path d="M9 20H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h3"/><path d="M15 16.5l4.5-4.5L15 7.5"/><path d="M19.5 12H9"/>',
  x:      '<path d="M7 7l10 10M17 7L7 17"/>'
};
function icono(nombre, tam) {
  return '<svg class="ic" width="' + tam + '" height="' + tam + '" viewBox="0 0 24 24" aria-hidden="true">' + SVG[nombre] + '</svg>';
}

var ESTADOS = {
  entrada: { titulo: "Entrada registrada",  icono: "check",  ms: 2500 },
  retardo: { titulo: "Entrada con retardo", icono: "reloj",  ms: 2500 },
  salida:  { titulo: "Salida registrada",   icono: "salida", ms: 2500 },
  cerrado: { titulo: "Registro cerrado",    icono: "reloj",  ms: 4000, aviso: "Aviso" },
  error:   { titulo: "No se registró",      icono: "x",      ms: 4000, aviso: "Motivo" }
};

function mostrarCargando() {
  var r = el("resultado");
  r.className = "resultado";
  r.innerHTML = '<div class="cargando"><div class="spinner"></div><div class="etiqueta">Verificando…</div></div>';
}

function mostrarResultado(res) {
  var estado = ESTADOS[res.estado] ? res.estado : "error";
  var cfg = ESTADOS[estado];

  var html = '<div class="r-cabecera etiqueta"><span>Asistencia</span><span>' + esc(fechaCabecera(res.fecha)) + '</span></div>';
  html += '<div class="r-centro">';
  html += '<div class="aro">' + icono(cfg.icono, 52) + '</div>';
  html += '<div class="r-estado">' + esc(cfg.titulo) + '</div>';
  if (res.nombre) html += '<div class="r-nombre">' + esc(nombreBonito(res.nombre)) + '</div>';

  if (res.hora && !cfg.aviso) {
    html += '<div class="datos">' +
      '<div><div class="k mono">HORA</div><div class="v mono">' + esc(res.hora) + '</div></div>' +
      '<div><div class="k mono">FECHA</div><div class="v mono">' + esc(fechaCorta(res.fecha)) + '</div></div>' +
      '<div><div class="k mono">ID</div><div class="v mono id">' + esc(res.id || "—") + '</div></div>' +
    '</div>';
  }
  if (res.puntos) {
    html += '<div class="puntos">+' + esc(res.puntos) + (res.puntos === 1 ? ' punto' : ' puntos') + '</div>';
  }
  if (res.mensaje && cfg.aviso) {
    html += '<div class="aviso"><div class="k mono">' + cfg.aviso.toUpperCase() + '</div><div class="v">' + esc(res.mensaje) + '</div></div>';
  }
  html += '</div>';
  html += '<div class="progreso"><div style="animation-duration:' + cfg.ms + 'ms"></div></div>';
  html += '<div class="toca">Toca para continuar</div>';

  var r = el("resultado");
  r.className = "resultado r-" + estado;
  r.innerHTML = html;

  try { if (navigator.vibrate) navigator.vibrate(estado === "error" ? [200, 100, 200] : 120); } catch (e) {}

  clearTimeout(temporizador);
  temporizador = setTimeout(cerrarResultado, cfg.ms);
}

function cerrarResultado() {
  clearTimeout(temporizador);
  el("resultado").className = "resultado hidden";
  procesando = false;
}

// ───────── Inicio ─────────
(function () {
  el("fecha-hoy").textContent = fechaCabecera("");
  if (MODO_PRUEBA) {
    el("banner-prueba").textContent = "MODO PRUEBA · NO CUENTA ASISTENCIA" + (HORA_SIM ? " · HORA " + HORA_SIM : "");
    el("banner-prueba").classList.remove("hidden");
    document.body.classList.add("prueba");
  }
  pin = leer(PIN_KEY);
  if (pin) mostrarPantallaEscaner(); else mostrarPantallaPin("");
})();
</script>
</body>
</html>
